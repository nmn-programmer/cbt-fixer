<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CBT Question Paper Studio &amp; ZIP Inspector</title>
    <meta name="description" content="Professional IDE workbench to inspect, validate, debug, edit, restructure, and export JEE CBT Question Paper ZIP archives." />
    
    <!-- PWA & Mobile Web Meta -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CBT Studio" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- Open Graph & Social -->
    <meta property="og:title" content="CBT Question Paper Studio &amp; ZIP Inspector" />
    <meta property="og:description" content="Professional IDE workbench to inspect, validate, debug, edit, restructure, and export JEE CBT Question Paper ZIP archives." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
