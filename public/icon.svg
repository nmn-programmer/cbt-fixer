<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#090d16" />

  <!-- Inner Glowing Shield -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="url(#cardGrad)" />

  <!-- Center CBT Typography -->
  <text x="256" y="270" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="124" letter-spacing="4">
    CBT
  </text>

  <!-- Subtitle Accent Pill -->
  <rect x="156" y="325" width="200" height="38" rx="19" fill="#4f46e5" fill-opacity="0.35" stroke="#6366f1" stroke-width="2" />
  <text x="256" y="349" text-anchor="middle" dominant-baseline="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" letter-spacing="3">
    STUDIO IDE
  </text>

  <!-- Corner Status Dots -->
  <circle cx="110" cy="110" r="14" fill="#38bdf8" />
  <circle cx="402" cy="110" r="14" fill="#34d399" />
</svg>
